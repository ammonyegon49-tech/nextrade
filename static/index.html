<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NexTrade</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}
body{background:#0b0e14;color:#e2e8f0}
header{background:#131722;border-bottom:1px solid #1e222d;padding:14px 24px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:1.3rem;font-weight:700;color:#38bdf8}.logo span{color:#fff}
.badge{background:rgba(16,185,129,.15);color:#10b981;padding:6px 12px;border-radius:20px;font-size:.85rem;font-weight:600}
.grid{max-width:1100px;margin:24px auto;padding:0 20px;display:grid;grid-template-columns:2fr 1fr;gap:20px}
.card{background:#131722;border:1px solid #1e222d;border-radius:10px;padding:20px}
.tickers{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}
.tcard{background:#1a1f2e;border:1px solid #262c3d;border-radius:8px;padding:14px;cursor:pointer}
.tcard.active,.tcard:hover{border-color:#38bdf8}
.tname{font-size:.8rem;color:#94a3b8}.tprice{font-size:1.3rem;font-weight:700;margin:6px 0}
.pos{color:#10b981;font-size:.8rem}.neg{color:#ef4444;font-size:.8rem}
.bal{background:#1a1f2e;padding:12px;border-radius:6px;margin:12px 0;display:flex;justify-content:space-between}
label{display:block;font-size:.8rem;color:#94a3b8;margin-bottom:4px}
input{width:100%;padding:10px;background:#0b0e14;border:1px solid #262c3d;color:#fff;border-radius:6px;margin-bottom:12px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{padding:12px;border:none;border-radius:6px;font-weight:700;cursor:pointer}
.buy{background:#10b981;color:#052e16}.sell{background:#ef4444;color:#fff}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:.85rem}
th,td{text-align:left;padding:8px;border-bottom:1px solid #1e222d}th{color:#94a3b8}
</style>
  <link rel="icon" type="image/svg+xml" href="/static/logo.svg">
</head>
<body>
<header><div class="logo" style="display:flex;align-items:center;gap:10px;"><img src="/static/logo.svg" width="28" height="28" alt="NexTrade">Nex<span>Trade</span></div><div class="badge" id="st">Connecting...</div></header>
<div class="grid">
  <div>
    <div class="tickers">
      <div class="tcard active" onclick="sel('bitcoin','BTC/USD',this)"><div class="tname">BTC/USD</div><div class="tprice" id="p-bitcoin">$--</div><div id="c-bitcoin">--</div></div>
      <div class="tcard" onclick="sel('ethereum','ETH/USD',this)"><div class="tname">ETH/USD</div><div class="tprice" id="p-ethereum">$--</div><div id="c-ethereum">--</div></div>
      <div class="tcard" onclick="sel('solana','SOL/USD',this)"><div class="tname">SOL/USD</div><div class="tprice" id="p-solana">$--</div><div id="c-solana">--</div></div>
    </div>
    <div class="card"><h3>Recent Trades</h3><table><thead><tr><th>Time</th><th>Pair</th><th>Side</th><th>USD</th><th>Price</th></tr></thead><tbody id="hist"><tr><td colspan="5" style="color:#64748b">No trades yet.</td></tr></tbody></table></div>
  </div>
  <div class="card">
    <h3>Market Order</h3>
    <div class="bal"><span>Balance:</span><strong id="bal">$10,000.00</strong></div>
    <label>Pair</label><input id="pair" value="BTC/USD" readonly>
    <label>Amount (USD)</label><input id="amt" type="number" value="500">
    <div class="btns"><button class="buy" onclick="trade('BUY')">Buy</button><button class="sell" onclick="trade('SELL')">Sell</button></div>
  </div>
</div>
<script>
let px={bitcoin:0,ethereum:0,solana:0},cur='bitcoin',bal=10000,first=true;
function sel(id,lbl,el){cur=id;document.getElementById('pair').value=lbl;document.querySelectorAll('.tcard').forEach(c=>c.classList.remove('active'));el.classList.add('active')}
async function load(){
  try{
    const r=await fetch('/api/prices'),j=await r.json();
    if(j.source==='live'&&j.data){
      document.getElementById('st').textContent='Live Feed';
      ['bitcoin','ethereum','solana'].forEach(k=>{
        if(j.data[k]){
          px[k]=j.data[k].usd;
          document.getElementById('p-'+k).textContent='$'+px[k].toLocaleString();
          const c=j.data[k].usd_24h_change,ce=document.getElementById('c-'+k);
          ce.textContent=(c>=0?'+':'')+c.toFixed(2)+'%';ce.className=c>=0?'pos':'neg';
        }
      });
    }
  }catch(e){document.getElementById('st').textContent='Offline'}
}
function trade(s){
  const a=parseFloat(document.getElementById('amt').value),p=px[cur];
  if(!a||a<=0||!p)return;
  if(s==='BUY'&&a>bal)return alert('Insufficient balance');
  bal=s==='BUY'?bal-a:bal+a;
  document.getElementById('bal').textContent='$'+bal.toFixed(2);
  const h=document.getElementById('hist');
  if(first){h.innerHTML='';first=false}
  h.insertAdjacentHTML('afterbegin',`<tr><td>${new Date().toLocaleTimeString()}</td><td>${document.getElementById('pair').value}</td><td style="color:${s==='BUY'?'#10b981':'#ef4444'}">${s}</td><td>$${a}</td><td>$${p.toLocaleString()}</td></tr>`);
}
load();setInterval(load,15000);
</script>
</body>
</html>
